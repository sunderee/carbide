name: Deploy gallery

# Builds the Carbide gallery (example/) for the web with WebAssembly and
# publishes it to GitHub Pages. The `--wasm` build ships both a skwasm (WASM)
# and a CanvasKit (JS) renderer; the bootstrapper serves WASM where the browser
# is cross-origin isolated and falls back to CanvasKit otherwise (GitHub Pages
# cannot set the COOP/COEP headers skwasm needs, so most visitors get the
# CanvasKit fallback — the app is identical either way).

on:
  push:
    branches: [master]
    paths:
      - "example/**"
      - "lib/**"
      - "fonts/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "tool/**"
      - ".github/workflows/verify.yaml"
      - ".github/workflows/gallery-web.yaml"
      - ".github/workflows/deploy-gallery.yml"
  workflow_dispatch:

# Read-only until the deploy job explicitly opts into Pages/OIDC.
permissions:
  contents: read

# One in-flight deploy at a time; let a newer one supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verification before deployment
    uses: ./.github/workflows/verify.yaml

  build:
    name: Prepare verified gallery artifact
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Download the browser-verified WASM build
        uses: actions/download-artifact@v8
        with:
          name: carbide-gallery-web
          path: gallery-web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: gallery-web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
