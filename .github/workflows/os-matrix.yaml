name: OS matrix

# Cross-platform behavioral runs (#233). PR CI stays Linux-only and fast;
# this workflow proves the suite on the other engines on a weekly cadence
# (and on demand via workflow_dispatch):
#
# - macOS + Windows: the full package suite. Text goldens are
#   Linux-authoritative by design — the comparator grants them a lenient
#   15% bound off-Linux, and non-text (vector) goldens render
#   bit-identically everywhere, so no test is excluded.
# - Web: the dart:io-free suites on the chrome platform with golden
#   comparison disabled (browser pixels are not baselines), plus the gallery
#   integration test driven in a real browser — the configuration the
#   deployed gallery actually ships.

on:
  schedule:
    # Mondays 05:30 UTC.
    - cron: "30 5 * * 1"
  workflow_dispatch:
  # Self-validating: editing this workflow runs it once on the PR.
  pull_request:
    paths:
      - .github/workflows/os-matrix.yaml

permissions:
  contents: read

jobs:
  desktop:
    name: Package tests — ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  web-smoke:
    name: Package tests — web (chrome)
    # The #271 "loading"-phase hang is fixed: it was the Plex font load in
    # `flutter_test_config.dart` — on the web test platform the
    # `rootBundle.load` future for a font asset never completes, wedging
    # every suite before its main() ran. `loadCarbidePlexFonts` now no-ops
    # on the web (goldens are skipped there anyway), so the job runs on the
    # PR self-validation trigger again. The timeout stays as a regression
    # bound: a reintroduced hang costs minutes, not the 6h default.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The icon fidelity sweep and pictogram suite need dart:io reference
      # files. Run foundations and the M13 form lifecycle/commit regressions
      # here; component goldens use the web pass-through comparator.
      - name: Run web-compilable suites
        run: >
          flutter test --platform chrome
          --dart-define=CARBIDE_SKIP_GOLDENS=true
          test/theme test/utils test/foundations
          test/lifecycle test/components/number_input test/components/text_area
          test/components/text_input
          test/components/slider
          test/components/date_picker
          test/components/tree_view
          test/components/data_table
          test/components/list
          test/components/modal test/components/dialog
          test/components/binary_controls test/components/checkbox
          test/components/radio_button test/components/toggle

  gallery-web-integration:
    name: Gallery integration test — web
    # All preceding fixtures consumed the 15-minute budget before the added
    # binary-control fixture could complete. Keep a bounded 20-minute budget.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: example
        run: flutter pub get

      # ubuntu-latest runners preinstall Chrome + a matching chromedriver.
      - name: Start chromedriver
        run: chromedriver --port=4444 &

      - name: Drive the gallery smoke test
        working-directory: example
        run: >
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/gallery_smoke_test.dart
          -d web-server

      - name: Drive tabs release contract test
        working-directory: example
        run: >
          flutter drive --release
          --driver=test_driver/integration_test.dart
          --target=integration_test/tabs_release_contract_test.dart
          -d web-server

      - name: Drive form ownership and native input test
        working-directory: example
        run: >
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/form_ownership_test.dart
          -d web-server

      - name: Drive text-area native limit and composition test
        working-directory: example
        run: >
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/text_area_limit_test.dart
          -d web-server

      - name: Drive number-input native draft and commit test
        working-directory: example
        run: >
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/number_input_commit_test.dart
          -d web-server

      - name: Drive slider native policy and semantics test
        working-directory: example
        run: >
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/slider_state_test.dart
          -d web-server

      - name: Drive date-picker native state and range session test
        working-directory: example
        run: >
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/date_picker_state_test.dart
          -d web-server

      - name: Drive date-picker state and range sessions in release mode
        working-directory: example
        run: >
          flutter drive --release
          --driver=test_driver/integration_test.dart
          --target=integration_test/date_picker_state_test.dart
          -d web-server

      - name: Drive tree-view native reconciliation and expansion test
        working-directory: example
        run: >
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/tree_view_state_test.dart
          -d web-server

      - name: Drive data-table native identity and focus test
        working-directory: example
        run: >
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/data_table_identity_test.dart
          -d web-server

      - name: Drive list native marker and scrolling test
        working-directory: example
        run: >
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/list_markers_test.dart
          -d web-server

      - name: Drive modal and dialog native focus contracts in release mode
        working-directory: example
        run: >
          flutter drive --release
          --driver=test_driver/integration_test.dart
          --target=integration_test/dialog_focus_test.dart
          -d web-server

      - name: Drive binary-control native read-only contracts in release mode
        working-directory: example
        run: >
          flutter drive --release
          --driver=test_driver/integration_test.dart
          --target=integration_test/binary_control_state_test.dart
          -d web-server

      - name: Drive password native visibility contracts in release mode
        working-directory: example
        run: >
          flutter drive --release
          --driver=test_driver/integration_test.dart
          --target=integration_test/password_visibility_test.dart
          -d web-server
