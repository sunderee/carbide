name: OS matrix

# Cross-platform behavioral runs (#233). PR CI stays Linux-only and fast;
# this workflow proves the suite on the other engines on a weekly cadence
# (and on demand via workflow_dispatch):
#
# - macOS + Windows: the full package suite. Text goldens are
#   Linux-authoritative by design — the comparator grants them a lenient
#   15% bound off-Linux, and non-text (vector) goldens render
#   bit-identically everywhere, so no test is excluded.
# - Web: the dart:io-free suites on the chrome platform with golden
#   comparison disabled (browser pixels are not baselines), plus the gallery
#   integration test driven in a real browser — the configuration the
#   deployed gallery actually ships.

on:
  schedule:
    # Mondays 05:30 UTC.
    - cron: "30 5 * * 1"
  workflow_dispatch:
  # Self-validating: editing this workflow runs it once on the PR.
  pull_request:
    paths:
      - .github/workflows/os-matrix.yaml

permissions:
  contents: read

jobs:
  desktop:
    name: Package tests — ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  web-smoke:
    name: Package tests — web (chrome)
    # The #271 "loading"-phase hang is fixed: it was the Plex font load in
    # `flutter_test_config.dart` — on the web test platform the
    # `rootBundle.load` future for a font asset never completes, wedging
    # every suite before its main() ran. `loadCarbidePlexFonts` now no-ops
    # on the web (goldens are skipped there anyway), so the job runs on the
    # PR self-validation trigger again. The timeout stays as a regression
    # bound: a reintroduced hang costs minutes, not the 6h default.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The icon fidelity sweep and pictogram suite read reference files via
      # dart:io and cannot compile for the web. Scope stays the dart:io-free
      # foundations for now; widening to the component suites (which run
      # with placeholder glyphs on the web) is a separate decision.
      - name: Run web-compilable suites
        run: >
          flutter test --platform chrome
          --dart-define=CARBIDE_SKIP_GOLDENS=true
          test/theme test/utils test/foundations

  gallery-web-integration:
    name: Gallery integration test — web
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: example
        run: flutter pub get

      # ubuntu-latest runners preinstall Chrome + a matching chromedriver.
      - name: Start chromedriver
        run: chromedriver --port=4444 &

      - name: Drive the gallery smoke test
        working-directory: example
        run: >
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/gallery_smoke_test.dart
          -d web-server

      - name: Drive tabs release contract test
        working-directory: example
        run: >
          flutter drive --release
          --driver=test_driver/integration_test.dart
          --target=integration_test/tabs_release_contract_test.dart
          -d web-server

      - name: Drive form ownership and native input test
        working-directory: example
        run: >
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/form_ownership_test.dart
          -d web-server

      - name: Drive text-area native limit and composition test
        working-directory: example
        run: >
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/text_area_limit_test.dart
          -d web-server
