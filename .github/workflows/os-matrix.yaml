name: OS matrix

# Cross-platform behavioral runs (#233). PR CI stays Linux-only and fast;
# this workflow proves the suite on the other engines on a weekly cadence
# (and on demand via workflow_dispatch):
#
# - macOS + Windows: the full package suite. Text goldens are
#   Linux-authoritative by design — the comparator grants them a lenient
#   15% bound off-Linux, and non-text (vector) goldens render
#   bit-identically everywhere, so no test is excluded.
# - Web: the dart:io-free suites on the chrome platform with golden
#   comparison disabled (browser pixels are not baselines), plus the gallery
#   integration test driven in a real browser — the configuration the
#   deployed gallery actually ships.

on:
  schedule:
    # Mondays 05:30 UTC.
    - cron: "30 5 * * 1"
  workflow_dispatch:
    inputs:
      picker-options-only:
        description: Run only the picker active-option native contract
        type: boolean
        default: false
  # Self-validating: editing this workflow runs it once on the PR.
  pull_request:
    paths:
      - .github/workflows/os-matrix.yaml

permissions:
  contents: read

jobs:
  picker-options:
    if: ${{ inputs.picker-options-only }}
    name: Picker active options — native web
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: example
        run: flutter pub get
      - name: Start chromedriver
        run: chromedriver --port=4444 &
      - name: Drive picker native active-option semantics in release mode
        working-directory: example
        run: >
          flutter drive --release
          --driver=test_driver/integration_test.dart
          --target=integration_test/picker_option_semantics_test.dart
          -d web-server

  desktop:
    if: ${{ !inputs.picker-options-only }}
    name: Package tests — ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

  web-smoke:
    if: ${{ !inputs.picker-options-only }}
    name: Package tests — web (chrome)
    # The #271 "loading"-phase hang is fixed: it was the Plex font load in
    # `flutter_test_config.dart` — on the web test platform the
    # `rootBundle.load` future for a font asset never completes, wedging
    # every suite before its main() ran. `loadCarbidePlexFonts` now no-ops
    # on the web (goldens are skipped there anyway), so the job runs on the
    # PR self-validation trigger again. The timeout stays as a regression
    # bound: a reintroduced hang costs minutes, not the 6h default.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The icon fidelity sweep and pictogram suite need dart:io reference
      # files. Run foundations and the M13 form lifecycle/commit regressions
      # here; component goldens use the web pass-through comparator.
      - name: Run web-compilable suites
        run: >
          flutter test --platform chrome
          --dart-define=CARBIDE_SKIP_GOLDENS=true
          test/theme test/utils test/foundations
          test/lifecycle test/components/number_input test/components/text_area
          test/components/text_input
          test/components/content_switcher
          test/components/menu
          test/components/picker_family test/components/dropdown
          test/components/select test/components/combo_box
          test/components/multi_select test/components/search
          test/components/slider
          test/components/date_picker
          test/components/tree_view
          test/components/data_table
          test/components/list
          test/components/modal test/components/dialog
          test/components/binary_controls test/components/checkbox
          test/components/radio_button test/components/toggle

  gallery-web-integration:
    if: ${{ !inputs.picker-options-only }}
    name: Gallery native web — ${{ matrix.group }}
    # All contracts ran sequentially in one job and exceeded 30 minutes.
    # Keep each group bounded and retain every debug/release invocation.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [gallery, lifecycle, data, controls, pickers, preferences]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: example
        run: flutter pub get

      # ubuntu-latest runners preinstall Chrome + a matching chromedriver.
      - name: Start chromedriver
        run: chromedriver --port=4444 &

      - name: Drive native contracts
        working-directory: example
        env:
          NATIVE_TEST_GROUP: ${{ matrix.group }}
        run: |
          drive_native() {
            echo "Native contract: $*"
            flutter drive "$@" --driver=test_driver/integration_test.dart -d web-server
          }
          case "$NATIVE_TEST_GROUP" in
            gallery)
              drive_native --target=integration_test/gallery_smoke_test.dart
              drive_native --release --target=integration_test/tabs_release_contract_test.dart
              drive_native --target=integration_test/list_markers_test.dart
              drive_native --release --target=integration_test/static_semantics_test.dart
              ;;
            lifecycle)
              drive_native --target=integration_test/form_ownership_test.dart
              drive_native --target=integration_test/text_area_limit_test.dart
              drive_native --target=integration_test/number_input_commit_test.dart
              drive_native --target=integration_test/slider_state_test.dart
              drive_native --target=integration_test/tree_view_state_test.dart
              ;;
            data)
              drive_native --target=integration_test/date_picker_state_test.dart
              drive_native --release --target=integration_test/date_picker_state_test.dart
              drive_native --release --target=integration_test/date_localization_test.dart
              drive_native --target=integration_test/data_table_identity_test.dart
              drive_native --release --target=integration_test/data_table_accessibility_test.dart
              drive_native --release --target=integration_test/context_menu_keyboard_test.dart
              ;;
            controls)
              drive_native --release --target=integration_test/dialog_focus_test.dart
              drive_native --release --target=integration_test/binary_control_state_test.dart
              drive_native --release --target=integration_test/password_visibility_test.dart
              drive_native --release --target=integration_test/content_switcher_names_test.dart
              drive_native --release --target=integration_test/unicode_typeahead_test.dart
              ;;
            pickers)
              drive_native --release --target=integration_test/read_only_picker_test.dart
              drive_native --release --target=integration_test/picker_keyboard_contract_test.dart
              drive_native --release --target=integration_test/picker_keyboard_without_semantics_test.dart
              drive_native --release --target=integration_test/picker_option_semantics_test.dart
              ;;
            preferences)
              drive_native --release --target=integration_test/reduced_motion_test.dart
              drive_native --release --target=integration_test/high_contrast_test.dart
              ;;
            *)
              echo "Unknown native test group: $NATIVE_TEST_GROUP" >&2
              exit 1
              ;;
          esac
