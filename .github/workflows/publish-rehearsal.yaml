name: Publish rehearsal

# This workflow never receives OIDC credentials and never uploads a package.
on:
  pull_request:
    paths:
      - pubspec.yaml
      - CHANGELOG.md
      - README.md
      - LICENSE
      - NOTICE
      - .gitignore
      - .pubignore
      - tool/release_verification.py
      - tool/test_release_verification.py
      - .github/workflows/verify.yaml
      - .github/workflows/publish*.yaml
  workflow_dispatch:
    inputs:
      fail-closed-probe:
        description: Prove failed verification skips the publication surrogate
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verification
    uses: ./.github/workflows/verify.yaml
    with:
      fail-closed-probe: ${{ inputs.fail-closed-probe || false }}

  dry-run:
    name: Publication surrogate (dry-run only)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 tool/release_verification.py dry-run

  assert-blocked:
    name: Assert failed verification blocks publication
    if: ${{ always() && inputs.fail-closed-probe }}
    needs: [verify, dry-run]
    runs-on: ubuntu-latest
    env:
      VERIFICATION_RESULT: ${{ needs.verify.result }}
      PUBLICATION_RESULT: ${{ needs.dry-run.result }}
    steps:
      - run: |
          test "$VERIFICATION_RESULT" = failure
          test "$PUBLICATION_RESULT" = skipped
          echo "Verified: failed gate prevented the publication surrogate from running."
