name: Publish to pub.dev

# Release only from an explicitly pushed tag. OIDC is confined to the upload job.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  version:
    name: Tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 tool/release_verification.py tag "$GITHUB_REF_NAME"

  verify:
    name: Verification
    uses: ./.github/workflows/verify.yaml

  publish:
    name: Publish to pub.dev
    needs: [version, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Dart (OIDC)
        uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Recheck the archive on the upload runner before tolerating its known warning.
      - run: python3 tool/release_verification.py dry-run
      - run: dart pub publish --force
