name: Regenerate goldens

# Regenerates golden baselines on Linux — the authoritative platform for
# goldens that contain text (glyph rasterization differs between macOS and
# Linux; see CONTRIBUTING). Dispatch this on a branch; any changed goldens
# are committed back to it.
#
# Note: the commit is made with GITHUB_TOKEN, which intentionally does not
# trigger a new CI run. Pull the branch and push (or open the PR) afterwards
# so CI runs on the regenerated state.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate goldens on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate goldens
        run: flutter test --update-goldens

      - name: Regenerate gallery and README review images
        working-directory: example
        run: |
          flutter pub get
          flutter test --dart-define=SCREENSHOTS=true --update-goldens test/screenshots_test.dart
          cp test/screenshots/overview.png ../docs/images/overview.png
          cp test/screenshots/button_dark.png ../docs/images/button_dark.png
          cp test/screenshots/data_table.png ../docs/images/data_table.png
          python3 ../tool/package_metadata.py --sync-screenshots

      - name: Commit regenerated goldens
        run: |
          git add -A -- '*/goldens/*.png' example/test/screenshots/*.png docs/images/*.png
          git add screenshots/*.png
          if git diff --cached --quiet; then
            echo "No golden changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate goldens on Linux (CI-authoritative)"
          git push
